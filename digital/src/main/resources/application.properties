spring.application.name=ecommerce-gateway
server.port=${SERVER_PORT:8080}

# URLs para los servicios que se conectarán en etapas posteriores.
services.catalog.base-url=${CATALOG_SERVICE_URL:http://localhost:8081}
services.inventory.base-url=${INVENTORY_SERVICE_URL:http://localhost:8082}
services.exchange.base-url=${EXCHANGE_SERVICE_URL:https://api.frankfurter.dev/v1}
services.exchange.base-currency=${EXCHANGE_BASE_CURRENCY:USD}
services.exchange.target-currency=${EXCHANGE_TARGET_CURRENCY:MXN}
